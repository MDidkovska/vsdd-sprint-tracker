# Local PoC MongoDB for the VSDD Sprint Tracker backend.
#
# PROOF OF CONCEPT ONLY (design.md §4b). MongoDB is a PoC choice and does not
# pre-empt the approved-database decision. This compose file runs a single local
# MongoDB with NO authentication, bound to localhost only. Do not use in
# production and do not expose the published port beyond the local machine.
#
# Usage:
#   docker compose up -d      # start MongoDB in the background
#   docker compose down       # stop and remove the container
#   docker compose down -v    # also remove the data volume

services:
  mongo:
    image: mongo:7
    container_name: vsdd-poc-mongo
    restart: unless-stopped
    # Bind to localhost only so the unauthenticated PoC instance is not exposed.
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - vsdd_mongo_data:/data/db
    healthcheck:
      # Confirms the server accepts connections before dependents rely on it.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  vsdd_mongo_data:
    driver: local
